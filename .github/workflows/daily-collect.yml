name: Daily Collect

on:
  schedule:
    # UTC 08:00 = 北京时间 16:00
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: '数据源（逗号分隔）'
        required: false
        default: 'github,rss'
      limit:
        description: '每个数据源的采集上限'
        required: false
        default: '20'

permissions:
  contents: write

env:
  # LLM Provider 配置
  LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: v2-skeleton-automation/pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collection pipeline
        working-directory: v2-skeleton-automation/pipeline
        run: |
          python pipeline.py \
            --sources ${{ github.event.inputs.sources || 'github,rss' }} \
            --limit ${{ github.event.inputs.limit || '20' }} \
            --verbose

      - name: Validate JSON data
        run: |
          python v2-skeleton-automation/hooks/validate_json.py v2-skeleton-automation/knowledge/articles/*.json

      - name: Check article quality
        run: |
          python v2-skeleton-automation/hooks/check_quality.py v2-skeleton-automation/knowledge/articles/*.json

      - name: Check for changes
        id: check_changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            # 统计文章数量
            ARTICLE_COUNT=$(find v2-skeleton-automation/knowledge/articles -name "*.json" -type f 2>/dev/null | wc -l | tr -d ' ')
            echo "article_count=$ARTICLE_COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          ARTICLE_COUNT="${{ steps.check_changes.outputs.article_count }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 采集 ${TODAY} 数据，共 ${ARTICLE_COUNT} 篇文章" \
            -m "Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>"
          git push
